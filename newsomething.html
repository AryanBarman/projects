  function hash(seed) {

  const easeOut = t => 1 - Math.pow(1 - t, 3);

  const easeBack = t => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  const easeOutCubic = easeOut, easeInOutCubic = easeInOut, easeOutBack = easeBack;

    const Ks = CAM_KEYS;
    if (t <= Ks[0].t) return Ks[0].v;

    let i = 0;
    while (i < Ks.length - 2 && t > Ks[i + 1].t) i++;

    for (let i = 0; i < total; i++) {
      const p0 = pts[i], p1 = pts[(i + 1) % pts.length];
      const dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.hypot(dx, dy);

  function drawCharacter(x, y, scale, opts = {}) {
    const st = STYLE[opts.role || 'jensen'] || STYLE.jensen;
    const {
      facing = 1, browTension = 0, armAngleL = 0.25, armAngleR = -0.25, bodyLean = 0, squint = 0, t = 0,
      walk = 0, walkAmt = 0, talk = 0, propR = null, propL = null, alpha = 1, phase = 0, silhouetteOnly = false
    } = opts;
    const hasBadge = opts.hasBadge !== undefined ? opts.hasBadge : !!st.badge;
    const D = 68, headR = 0.50 * D, torsoH = 1.40 * D, legH = 1.40 * D;
    const line = PAL.inkStroke;
    const fillJacket = silhouetteOnly ? PAL.ink : st.jacket;

    const fillSkin   = silhouetteOnly ? PAL.ink : st.skin;
    const fillHair   = silhouetteOnly ? PAL.ink : st.hairCol;
    const blink = ((t * 0.27 + phase) % 1) > 0.96 ? 1 : squint;

    ctx.save();
    if (alpha < 1) ctx.globalAlpha *= alpha;
    ctx.translate(x, y);
    ctx.scale(scale * facing, scale);
    if (!silhouetteOnly) {
      ctx.save();

      ctx.restore();
    }
    ctx.translate(0, -Math.abs(Math.sin(walk)) * 0.05 * D * walkAmt);

    const hipY = -legH;
    const sw = Math.sin(walk) * 0.55 * walkAmt;
    const leg = (cx, ang) => {
      ctx.save();
      ctx.translate(cx * D, hipY);
      ctx.rotate(ang);
      toonPoly([[-0.10 * D, 0], [0.10 * D, 0], [0.08 * D, legH - 0.12 * D], [-0.08 * D, legH - 0.12 * D]], { fill: fillPants, line, lw: 5 });
      toonPoly([[-0.14 * D, legH - 0.12 * D], [0.34 * D, legH - 0.12 * D], [0.38 * D, legH], [-0.14 * D, legH]], { fill: silhouetteOnly ? fillPants : '#0B1217', line, lw: 4 });
      ctx.restore();
    };
    leg(-0.17, sw); leg(0.17, -sw);

    ctx.save();
    ctx.translate(0, hipY);
    ctx.rotate(bodyLean + Math.sin(t * 1.3 + phase * 7) * 0.012);
    const shoulderY = -torsoH;
    toonPoly([[-0.55 * D, shoulderY], [0.55 * D, shoulderY], [0.50 * D, 0], [-0.50 * D, 0]], { fill: fillJacket, line, lw: 5.5 });
    if (!silhouetteOnly) {
      toonPoly([[0, shoulderY + 0.12 * D], [0, 0]], { line: '#495866', lw: 3, closed: false });
      toonPoly([[-0.24 * D, shoulderY], [-0.14 * D, shoulderY + 0.22 * D], [0, shoulderY + 0.14 * D], [0.14 * D, shoulderY + 0.22 * D], [0.24 * D, shoulderY]], { fill: st.collar, line, lw: 4 });
      if (hasBadge) toonPoly(rectPts(0.18 * D, shoulderY + 0.42 * D, 0.20 * D, 0.26 * D), { fill: PAL.nvidiaSage, line, lw: 3 });
    }
    const arm = (sx, ang, prop) => {
      ctx.save();
      ctx.translate(sx, shoulderY + 0.16 * D);
      ctx.rotate(ang);
      toonPoly([[-0.11 * D, 0], [0.11 * D, 0], [0.09 * D, 1.15 * D], [-0.09 * D, 1.15 * D]], { fill: fillJacket, line, lw: 4.5 });
      toonPoly(circlePts(0, 1.20 * D, 0.12 * D, 0.12 * D, 14), { fill: fillSkin, line, lw: 4 });
      if (!silhouetteOnly) drawProp(prop, ang, line);
      ctx.restore();
    };
    arm(-0.52 * D, armAngleL, propL);
    arm(0.52 * D, armAngleR, propR);

    const headCY = shoulderY - headR * 0.92;
    toonPoly(circlePts(0, headCY, headR, headR, 28), { fill: fillSkin, line, lw: 5.5 });
    if (!silhouetteOnly) {
      const eyeY = headCY - 0.08 * D;
      const eyeH = Math.max(0.02 * D, 0.14 * D * (1 - blink));
      const eyeW = 0.11 * D;
      toonPoly(circlePts(-0.14 * D, eyeY, eyeW * 0.5, eyeH * 0.5, 12), { fill: PAL.inkStroke, lw: 0, boil: 0.2 });
      toonPoly(circlePts(0.22 * D, eyeY, eyeW * 0.5, eyeH * 0.5, 12), { fill: PAL.inkStroke, lw: 0, boil: 0.2 });
      const browY = eyeY - 0.13 * D, bTilt = browTension * 0.06 * D;
      toonPoly([[-0.25 * D, browY - bTilt], [-0.03 * D, browY + bTilt]], { line, lw: 4.5, closed: false });
      toonPoly([[0.11 * D, browY + bTilt], [0.33 * D, browY - bTilt]], { line, lw: 4.5, closed: false });
      const mouthY = headCY + 0.18 * D;
      if (talk > 0) {
        const open = 0.02 + 0.11 * Math.abs(Math.sin(Math.floor(t * 12) * 2.3 + phase * 9)) * talk;
        toonPoly(circlePts(0.04 * D, mouthY, 0.10 * D, open * D, 12), { fill: '#6B1F1A', line, lw: 3.5, boil: 0.3 });
      } else if (browTension > 0.3) toonPoly([[-0.12 * D, mouthY + 0.03 * D], [0.04 * D, mouthY - 0.02 * D], [0.20 * D, mouthY + 0.03 * D]], { line, lw: 4, closed: false });
      else toonPoly([[-0.12 * D, mouthY], [0.20 * D, mouthY]], { line, lw: 4, closed: false });

      if (st.glasses) {

        toonPoly(rectPts(0.06 * D, eyeY - 0.12 * D, 0.30 * D, 0.24 * D), { fill: 'rgba(255,255,255,0.18)', line: '#323D47', lw: 3.5, boil: 0.3 });
        toonPoly([[-0.04 * D, eyeY - 0.02 * D], [0.06 * D, eyeY - 0.02 * D]], { line: '#323D47', lw: 3.5, closed: false });
      }

    const hc = fillHair;
    switch (st.hair) {
      case 'jensen':
        toonPoly([[-0.50 * D, headCY - 0.05 * D], [-0.48 * D, headCY - 0.42 * D], [-0.12 * D, headCY - 0.56 * D], [0.34 * D, headCY - 0.52 * D], [0.50 * D, headCY - 0.24 * D], [0.24 * D, headCY - 0.32 * D], [-0.24 * D, headCY - 0.28 * D]], { fill: hc, line, lw: 4.5 });
        break;
      case 'bob':
        toonPoly([[-0.54 * D, headCY + 0.18 * D], [-0.52 * D, headCY - 0.44 * D], [0.0, headCY - 0.58 * D], [0.52 * D, headCY - 0.44 * D], [0.54 * D, headCY + 0.18 * D], [0.36 * D, headCY - 0.22 * D], [-0.36 * D, headCY - 0.22 * D]], { fill: hc, line, lw: 4.5 });
        break;
      case 'bun':
        toonPoly([[-0.54 * D, headCY + 0.10 * D], [-0.52 * D, headCY - 0.44 * D], [0.0, headCY - 0.58 * D], [0.52 * D, headCY - 0.44 * D], [0.54 * D, headCY + 0.10 * D], [0.36 * D, headCY - 0.22 * D], [-0.36 * D, headCY - 0.22 * D]], { fill: hc, line, lw: 4.5 });
        toonPoly(circlePts(-0.05 * D, headCY - 0.68 * D, 0.20 * D, 0.20 * D, 14), { fill: hc, line, lw: 4 });
        break;
      case 'short':
        toonPoly([[-0.50 * D, headCY - 0.02 * D], [-0.48 * D, headCY - 0.40 * D], [0, headCY - 0.56 * D], [0.48 * D, headCY - 0.40 * D], [0.50 * D, headCY - 0.02 * D], [0.30 * D, headCY - 0.30 * D], [-0.30 * D, headCY - 0.30 * D]], { fill: hc, line, lw: 4.5 });
        break;
    }
    ctx.restore();
    ctx.restore();
  }

  function hitFx(cx, cy, t, hitT, { color = PAL.amberHighlight, r = 170, rays = 12, dur = 0.55, core = true } = {}) {
    const u = (t - hitT) / dur;
    if (u < 0 || u > 1) return;
    const e = easeOutCubic(u);
    ctx.save();
    ctx.translate(cx, cy);
    if (core && u < 0.2) {
      ctx.globalAlpha = 0.55 * (1 - u / 0.2);
      ctx.fillStyle = PAL.white;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1 - u;
    ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineWidth = 12 * (1 - u) + 2;
    ctx.beginPath(); ctx.arc(0, 0, r * e, 0, TAU); ctx.stroke();
    ctx.lineWidth = 5;
    const seed = Math.floor(hitT * 100);
    for (let i = 0; i < rays; i++) {
      const a = (i / rays) * TAU + (hash2(seed + i, 3) - 0.5) * 0.35;
      const r0 = r * 0.35 * e + 16, r1 = r0 + 14 + 56 * (1 - u) * (0.6 + hash2(seed + i, 50) * 0.8);
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.stroke();
    }
    ctx.restore();
  }

  // =========================================================================
  // 5. CONNECTED 3D ARCHITECTURAL CORRIDOR & MULTI-PART 3D ASSETS
  // =========================================================================
  function fitSize(g, text, size, maxW, weight = 900, fam = 'system-ui, "Segoe UI", sans-serif') {
    g.font = weight + ' ' + size + 'px ' + fam;
    const mw = g.measureText(text).width;
    return mw > maxW ? Math.max(10, Math.floor(size * maxW / mw)) : size;
  }
  function cardBase(g, w, h, head, accent, bodyCol) {
    g.fillStyle = bodyCol || '#0B191E'; g.fillRect(0, 0, w, h);
    g.fillStyle = accent; g.fillRect(0, 0, w, h * 0.22);
    g.strokeStyle = accent; g.lineWidth = 10; g.strokeRect(5, 5, w - 10, h - 10);
    g.fillStyle = PAL.ink; g.textAlign = 'center'; g.textBaseline = 'middle';
    const s = fitSize(g, head, Math.round(h * 0.11), w * 0.88, 900);
    g.font = '900 ' + s + 'px system-ui, "Segoe UI", sans-serif';
    g.fillText(head, w / 2, h * 0.11);
  }
  function panel(pw, ph, w, h, paint) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide }));
    m.userData = { g, tex, paint, w, h };
    paint(g, 0, w, h); tex.needsUpdate = true;
    return m;
  }
  function tag(text, pw, ph, bg, fg, size) {
    return panel(pw, ph, Math.round(pw * 200), Math.round(ph * 200), (g, t, w, h) => {
      if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
      g.textAlign = 'center'; g.textBaseline = 'middle';
      const s = fitSize(g, text, size || Math.round(h * 0.55), w * 0.8);
      g.font = '900 ' + s + 'px "Arial Black", Arial, sans-serif';
      g.fillStyle = fg; g.fillText(text, w / 2, h / 2 + 2);
    });
  }
  function infoCard(header, line1, line2, accent = PAL.cyan) {
    return panel(2.9, 1.85, 580, 370, (g, t, w, h) => {
      cardBase(g, w, h, header, accent, '#0B191E');
      g.fillStyle = PAL.ivory; g.textAlign = 'center';
      const s1 = fitSize(g, line1, 44, w * 0.86, 900);
      g.font = '900 ' + s1 + 'px system-ui, sans-serif';
      g.fillText(line1, w / 2, h * 0.52);
      g.fillStyle = accent;
      const s2 = fitSize(g, line2, 28, w * 0.86, 700);
      g.font = '700 ' + s2 + 'px system-ui, sans-serif';
      g.fillText(line2, w / 2, h * 0.78);
    });
  }
  function bx(w, h, d, col, em = 0x000000, rough = 0.5, metal = 0.2) {
    return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: col, emissive: em, roughness: rough, metalness: metal }));
  }

  // Tilted 3D Silicon Package (rotation.x = 0.58 so the top die face & gold pins always face the camera!)
  function buildChipPackage3D(label, bgHex, fgHex, dieColor = 0x45b8ac, size = 1.65) {
    const g = new THREE.Group();
    const sub = bx(size, 0.14, size, 0x163832, 0x071a16, 0.45, 0.3);
    const ihs = bx(size * 0.70, 0.12, size * 0.70, 0xcfd6da, dieColor, 0.25, 0.8);
    ihs.material.emissiveIntensity = 0.45; ihs.position.y = 0.13;
    const cap = tag(label, size * 0.66, size * 0.66, bgHex, fgHex, 58);
    cap.rotation.x = -Math.PI / 2; cap.position.y = 0.195;
    g.add(sub, ihs, cap);
    g.rotation.x = 0.58;
    for (let i = 0; i < 7; i++) {
      const off = lerp(-size * 0.38, size * 0.38, i / 6);
      [-1, 1].forEach(s => {
        const p1 = bx(0.06, 0.05, 0.14, 0xebc16b, 0x4d3400, 0.3, 0.8); p1.position.set(off, 0.02, s * (size * 0.52));
        const p2 = bx(0.14, 0.05, 0.06, 0xebc16b, 0x4d3400, 0.3, 0.8); p2.position.set(s * (size * 0.52), 0.02, off);
        g.add(p1, p2);
      });
    }
    return g;
  }

  function projectedChar(wx, wy, wz, hWorld) {
    const [x, y] = worldToScreen(wx, wy, wz);
    if (!HAS_THREE) return { x, y, s: 1, depth: 0, behind: false };
    const v = new THREE.Vector3(wx, wy + hWorld * 0.5, wz);
    const dist = camera.position.distanceTo(v);
    const ppu = 540 / (dist * Math.tan(camera.fov * Math.PI / 360));
    const behind = v.clone().applyMatrix4(camera.matrixWorldInverse).z > -1.2;
    return { x, y, s: hWorld * ppu / (3.8 * 68), depth: dist, behind };
  }
  function worldToScreen(wx, wy, wz) {
    if (!HAS_THREE || !camera) return [960 + wx * 115, 860 - wy * 115];
    const v = new THREE.Vector3(wx, wy, wz); v.project(camera);
    return [(v.x * 0.5 + 0.5) * 1920, (-v.y * 0.5 + 0.5) * 1080];
  }
  function cordBetween(m, a, b) {
    const d = new THREE.Vector3().subVectors(b, a), len = Math.max(0.001, d.length());
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    m.scale.set(1, len, 1);
  }
  function gridTex(bg, line, rx, ry) {
    const c = document.createElement('canvas'); c.width = 512; c.height = 512;
    const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, 512, 512);
    g.strokeStyle = line; g.lineWidth = 3;
    for (let i = 0; i <= 512; i += 64) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 512); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(512, i); g.stroke();
    }
    const tx = new THREE.CanvasTexture(c);
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(rx, ry);
    return tx;
  }

  // Connected 3D World Environment: Unified Silicon Valley -> Texas Fab Corridor
  // Features perimeter architectural skyline, overhead gantry trusses, floor data conduits, and volumetric light shafts
  function setupStage(floorW) {
    renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    renderer.setSize(1920, 1080, false);
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;

    scene = new THREE.Scene();
    scene.background = new THREE.Color(PAL.parchment);
    scene.fog = new THREE.Fog(PAL.parchment, 45, 135);

    camera = new THREE.PerspectiveCamera(44, 1920 / 1080, 0.1, 260);
    hemiLight = new THREE.HemisphereLight(0xffffff, 0xd6cebe, 0.98); scene.add(hemiLight);

    dirLight = new THREE.DirectionalLight(0xfffaf0, 0.95);
    dirLight.position.set(10, 18, 12); dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 1; dirLight.shadow.camera.far = 90;
    const sd = 28;
    dirLight.shadow.camera.left = -sd; dirLight.shadow.camera.right = sd;
    dirLight.shadow.camera.top = sd; dirLight.shadow.camera.bottom = -sd;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight); scene.add(dirLight.target);

    rimLight = new THREE.PointLight(0x45b8ac, 1.6, 38); scene.add(rimLight);

    X.floorN = new THREE.Mesh(
      new THREE.PlaneGeometry(floorW, 150),
      new THREE.MeshStandardMaterial({ map: gridTex('#0E2027', 'rgba(69,184,172,0.14)', floorW / 6, 25), roughness: 0.82 })
    );
    X.floorN.rotation.x = -Math.PI / 2; X.floorN.position.set(floorW / 2 - 20, 0, -24);
    X.floorN.receiveShadow = true; scene.add(X.floorN);

    X.floorD = new THREE.Mesh(
      new THREE.PlaneGeometry(floorW, 150),
      new THREE.MeshStandardMaterial({ map: gridTex('#E7E1D3', 'rgba(11,25,30,0.09)', floorW / 6, 25), roughness: 0.85, transparent: true, opacity: 1 })
    );
    X.floorD.rotation.x = -Math.PI / 2; X.floorD.position.set(floorW / 2 - 20, 0.004, -24);
    X.floorD.receiveShadow = true; scene.add(X.floorD);

    X.cA = new THREE.Color(); X.cB = new THREE.Color();

    // Connected Skyline & Fab Architecture Backdrop (z: -50) + Overhead Gantry Beams + Floor Conduits
    for (let i = 0; i < 18; i++) {
      const bxPos = -18 + i * 5.2;
      const bh = 6.5 + (i % 4) * 2.2;
      const tower = bx(3.6, bh, 2.2, i % 2 === 0 ? 0x162C35 : 0x1E3A46, 0x0b191e, 0.65);
      tower.position.set(bxPos, bh / 2, -52);
      scene.add(tower);

      const col = bx(0.45, 11.5, 0.45, 0x9fb4bd, 0x1b2a30);
      col.position.set(bxPos, 5.75, -47.5);
      scene.add(col);
    }
    // Continuous overhead industrial gantry rail linking Silicon Valley to Texas
    const gantry = bx(110, 0.35, 0.5, 0x2E5261, 0x12262E, 0.4, 0.7);
    gantry.position.set(22, 9.6, -47.5);
    scene.add(gantry);

    // Parallel floor data conduits running across the entire world
    [-12, -26, -38].forEach((cz, idx) => {
      const pipe = bx(110, 0.08, 0.16, idx === 1 ? 0x45b8ac : 0x2E5261, idx === 1 ? 0x165e56 : 0x000000);
      pipe.position.set(22, 0.04, cz);
      scene.add(pipe);
    });

    for (let i = 0; i < 8; i++) {
      const sh = new THREE.Mesh(
        new THREE.PlaneGeometry(2.8, 13),
        new THREE.MeshBasicMaterial({ color: 0xfff1c9, transparent: true, opacity: 0.08, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
      );
      sh.position.set(-8 + i * 11, 5.0, -10 - (i % 2) * 18);
      sh.rotation.z = 0.35; sh.rotation.y = 0.4;

    }
  }

  function drawHeadline(title, subTag, alpha, accent = PAL.amber, t = 1e9, t0 = 0) {
    if (alpha <= 0.01) return;

    ctx.fillStyle = PAL.ink; ctx.fillRect(96, 78, w, 66);
    ctx.fillStyle = accent; ctx.fillRect(96, 78, 12, 66);

      ctx.font = '600 19px system-ui, sans-serif';

  function applyCamera(t, shakeList, rollFn) {
    const cv = evalCam(t); let shake = 0;
    shakeList.forEach(([s0, kk, amp]) => { if (t >= s0 && t < s0 + 1.0) shake += Math.exp(-(t - s0) * kk) * amp; });
    camera.fov = cv[6]; camera.updateProjectionMatrix();
    camera.position.set(cv[0] + Math.sin(t * 95) * shake, cv[1] + Math.cos(t * 82) * shake * 0.7, cv[2]);
    camera.lookAt(cv[3], cv[4], cv[5]);
    if (rollFn) camera.rotation.z += rollFn(t);
    camera.updateMatrixWorld();
    dirLight.position.set(cv[3] + 10, cv[4] + 16, cv[5] + 12);
    dirLight.target.position.set(cv[3], cv[4], cv[5]);
    dirLight.target.updateMatrixWorld();
    rimLight.position.set(cv[0] - 4, cv[1] + 3, cv[2] - 6);
    return cv;
  }

  function applyLook(day) {
    X.cA.set(PAL.ink).lerp(X.cB.set(PAL.parchment), day);
    scene.background.copy(X.cA); scene.fog.color.copy(X.cA);
    X.floorD.material.opacity = day; X.floorD.visible = day > 0.01;
    hemiLight.color.set(0x2e5261).lerp(X.cB.set(0xffffff), day);
    hemiLight.groundColor.set(0x060e12).lerp(X.cB.set(0xd6cebe), day);
    hemiLight.intensity = lerp(0.85, 0.92, day);
    dirLight.intensity = lerp(0.95, 0.78, day);
    rimLight.intensity = lerp(2.1, 1.0, day);
  }

  function smearPass(t) {
    const c0 = evalCam(t), c1 = evalCam(Math.max(0, t - 0.06));
    const vel = Math.hypot(c0[0] - c1[0], c0[1] - c1[1], c0[2] - c1[2]) / 0.06;
    const k = clamp((vel - 7) / 22, 0, 0.2);
    if (k > 0.01) {
      const dir = Math.sign(c0[0] - c1[0]) || 1, vy = Math.sign(c0[1] - c1[1]) || 0;

    X.tower = KIT.towerCounter('GROSS MARGINS', 'NVIDIA GROSS MARGINS', 75, '%', '~', 15.14, 16.40, PAL.amberHi); X.tower.position.set(3.2, 0, 0);
    X.st2.add(X.rack, X.toll, X.tower);
    scene.add(X.st2);

    // STATION 3 (0, -56): Custom Silicon inside TerraFab (Beats 5-6: 19.26s - 29.92s)
    X.st3 = new THREE.Group(); X.st3.position.set(0, 0, -56); X.st3.visible = false;
    X.arch = KIT.archPortal('TERRAFAB CUSTOM SILICON', 9.8, 5.3, PAL.cyan); X.arch.position.set(0, 0, -1.5);
    X.edgeDie = buildChipPackage3D('EDGE INFERENCE', PAL.cyan, PAL.ink, 0x45B8AC, 1.75); X.edgeDie.position.set(0, 1.65, 0);
    X.cyber = KIT.cybercab('TESLA CYBERCABS', 'PURE COST', 'Edge inference silicon', PAL.sageHi); X.cyber.position.set(-3.2, 0, 0.4);
    X.optimus = KIT.robot('OPTIMUS ROBOTS', 'PURE COST', 'Manufacturing cost only', PAL.amberHi); X.optimus.position.set(3.2, 0, 0.4);
    X.st3.add(X.arch, X.edgeDie, X.cyber, X.optimus);
    scene.add(X.st3);

    // STATION 4 (0, -84): xAI Custom Training Clusters (Beats 7-8: 29.92s - 38.00s)
    X.st4 = new THREE.Group(); X.st4.position.set(0, 0, -84); X.st4.visible = false;
    X.queueBlocks = ['MICROSOFT', 'GOOGLE', 'META'].map((nm, idx) => {
      const qb = KIT.queueBlock(nm + ' QUEUE');
      qb.position.set(-2.6, 0.65 + idx * 1.25, 0.2);
      X.st4.add(qb);
      return qb;
    });
    X.xaiCluster = KIT.clusterRack('xAI TRAINING CLUSTERS', 'BYPASSED QUEUE', 'No waiting behind Big Tech', PAL.sageHi);
    X.xaiCluster.position.set(2.4, 0, -0.2);
    X.st4.add(X.xaiCluster);
    scene.add(X.st4);
  }

  const HEADS = [
    [0.00,  5.30, "Jensen Wong in the driver's seat", 'Taking control of the TerraFab machine', PAL.cyan, 0.00],
    [5.86,  18.80, 'Economics on the ground: Server markup', 'Funding Nvidia’s nearly 75% gross margins', PAL.coral, 5.86],
    [19.26, 29.75, 'Custom silicon inside TerraFab', 'Cybercabs & Optimus at pure manufacturing cost', PAL.sage, 19.26],
    [29.92, 38.00, 'xAI custom training clusters', 'No waiting in line behind Microsoft, Google, or Meta', PAL.amber, 29.92]
  ];

  function renderScene(t) {
    if (!HAS_THREE) return;
    applyCamera(
      t,
      [[3.22, 8, 0.10], [11.64, 8, 0.14], [15.14, 8, 0.12], [26.32, 8, 0.12], [33.68, 8, 0.14]],
      tt => Math.sin(seg(tt, 5.5, 6.4) * Math.PI) * 0.025 - Math.sin(seg(tt, 19.0, 20.0) * Math.PI) * 0.025
    );
    applyLook(clamp(0.12 + smooth(19.26, 20.0, t) * 0.18 - smooth(29.92, 30.6, t) * 0.18, 0.08, 0.35));

    // Through-line conduit growth + state transitions
    {
      const head = clamp(seg(t, 0.0, 36.8), 0.04, 1);
      X.thread.geometry.setDrawRange(0, Math.floor(head * X.thSeg) * 6 * 6);
      if (t >= 11.64 && t < 19.26) X.threadMat.color.setHex(0xD94E43);
      else if (t >= 19.26 && t < 29.92) X.threadMat.color.setHex(0x45B8AC);
      else if (t >= 29.92) X.threadMat.color.setHex(0x9BE01B);
      else X.threadMat.color.setHex(0xEBC16B);
    }

    // Station 1 (0.00s - 6.00s)
    X.st1.visible = t < 6.2;
    if (X.st1.userData.helm) {
      X.st1.userData.helm.rotation.z = Math.sin(t * 2.4) * 0.45 * smooth(3.0, 3.6, t);
    }

    // Station 2 (5.70s - 19.50s)
    {
      const on = t >= 5.6 && t < 19.6;
      X.st2.visible = on;
      const slamU = easeOutBounce(seg(t, 11.64, 12.25));
      X.toll.visible = on && t >= 11.55;
      X.toll.userData.arm.position.y = lerp(3.4, 0.45, slamU);
      X.toll.scale.setScalar(Math.max(0.01, easeOutBack(seg(t, 11.55, 12.05))));

      const barU = easeOutCubic(seg(t, 15.14, 16.40));
      X.tower.visible = on && t >= 15.05;
      X.tower.userData.core.scale.y = Math.max(0.04, barU);
      X.tower.userData.core.position.y = 0.26 + 1.70 * Math.max(0.04, barU);
      if (X.tower.visible) {
        const ud = X.tower.userData.readPanel.userData;
        ud.paint(ud.g, t, ud.w, ud.h);
        ud.tex.needsUpdate = true;
      }
    }

    // Station 3 (19.00s - 30.20s)
    {
      const on = t >= 19.0 && t < 30.3;
      X.st3.visible = on;
      X.edgeDie.visible = on && t >= 22.45;
      X.edgeDie.rotation.y = t * 1.5;
      X.cyber.visible = on && t >= 26.25;
      X.cyber.scale.setScalar(Math.max(0.01, easeOutBack(seg(t, 26.32, 26.90))));
      X.optimus.visible = on && t >= 26.55;
      X.optimus.scale.setScalar(Math.max(0.01, easeOutBack(seg(t, 26.55, 27.15))));
    }

    // Station 4 (29.70s - 38.00s)
    {
      const on = t >= 29.7;
      X.st4.visible = on;
      X.queueBlocks.forEach((qb, idx) => {
        const tStart = 34.4 + idx * 0.65;
        qb.visible = on && t >= tStart;
        qb.scale.setScalar(Math.max(0.01, easeOutBack(seg(t, tStart, tStart + 0.45))));
      });
      X.xaiCluster.visible = on && t >= 33.40;
      X.xaiCluster.scale.setScalar(Math.max(0.01, easeOutBack(seg(t, 33.50, 34.10))));
    }

    renderer.render(scene, camera);

    smearPass(t);
    const cast = [];
    const add = (role, wx, wy, wz, h, t0, t1, o) => {
      if (t >= t0 && (t1 === undefined || t < t1)) cast.push({ role, wx, wy, wz, h, t0, t1, o });
    };

    const jStepX = lerp(-3.0, -1.4, easeOutCubic(seg(t, 1.4, 2.3)));
    add('jensen', jStepX, 0, 1.4, 2.35, 0.3, 5.8, { facing: 1, phase: 1, armAngleR: -1.55, armAngleL: -1.30, browTension: -0.2, talk: 0.7 });
    add('elon',   -4.4, 0, -26.4, 2.38, 8.68, 19.0, { facing: 1, phase: 2, armAngleR: -1.45, armAngleL: 0.3, browTension: 0.42, talk: 0.65 });
    add('jensen', -2.1, 0, -54.2, 2.35, 19.4, 29.8, { facing: 1, phase: 3, propR: 'wafer', armAngleR: -1.65, armAngleL: 0.3, browTension: -0.25, talk: 0.7 });
    add('elon',    4.6, 0, -82.2, 2.38, 30.2, undefined, { facing: -1, phase: 4, armAngleR: -1.65, armAngleL: 0.3, browTension: -0.25, talk: 0.7 });

    drawCast(t, cast);

    const wb = (x, y, z) => worldToScreen(x, y, z);
    { const [x, y] = wb(0, 2.0, 0.4); hitFx(x, y, t, 3.22, { color: PAL.cyan, r: 250, rays: 14 }); }
    { const [x, y] = wb(-0.2, 3.55, -27.6); hitFx(x, y, t, 11.64, { color: PAL.coral, r: 280, rays: 16 }); }
    { const [x, y] = wb(3.2, 4.78, -27.95); hitFx(x, y, t, 15.14, { color: PAL.amberHi, r: 280, rays: 16 }); }
    { const [x, y] = wb(0, 1.65, -56.0); hitFx(x, y, t, 22.58, { color: PAL.cyan, r: 260, rays: 16 }); }
    { const [x, y] = wb(-3.2, 2.95, -55.6); hitFx(x, y, t, 26.32, { color: PAL.sageHi, r: 240, rays: 14 }); }
    { const [x, y] = wb(2.4, 4.95, -84.2); hitFx(x, y, t, 33.68, { color: PAL.sageHi, r: 300, rays: 18 }); }

    HEADS.forEach(h => {
      const a = env(t, h[0], h[1], 0.35, 0.35);
      if (a > 0.01) drawHeadline(h[2], h[3], a, h[4], t, h[5]);
    });
  }

  function renderModelSheet(t) {
    ctx.fillStyle = PAL.ivory; ctx.fillRect(0, 0, 1920, 1080);
    ctx.fillStyle = PAL.ink; ctx.font = '900 40px system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText("Act 3 Part 2 — Jensen in the Driver's Seat: Economics, Cybercabs, Optimus & xAI — CAST SHEET (?sheet=1)", 96, 86);
    const roles = ['jensen', 'elon', 'board', 'analyst'];
    roles.forEach((r, i) => {
      const x = 340 + i * Math.floor(1240 / Math.max(1, roles.length - 1));
      drawCharacter(x, 560, 0.85, { role: r, facing: 1, t });
      drawCharacter(x, 960, 0.85, { role: r, facing: 1, t, silhouetteOnly: true });
    });
  }

  function render(t) {
    const time = clamp(+t || 0, 0, DUR); curTime = time;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.clearRect(0, 0, 1920, 1080);
    if (HAS_THREE) glCanvas.style.opacity = showSheet ? '0' : '1';
    if (showSheet) renderModelSheet(time);
    else renderScene(time);
    const gf = Math.floor(time * 12);
    grainPat.setTransform(new DOMMatrix([1, 0, 0, 1, Math.floor(hash(gf * 5 + 3) * 256), Math.floor(hash(gf * 5 + 4) * 256)]));
    ctx.fillStyle = grainPat; ctx.fillRect(0, 0, 1920, 1080);
    if (!showSheet) drawRail(time, [0.00, 5.86, 19.26, 29.92, 38.00]);
    drawCaptions(time);
  }

  window.DUR = DUR;
  window.render = render;
  window.CUE_SHEET = CUE_SHEET;
  window.STORY = { SUBS, LEDGER, CAM_KEYS };
  window.READY = false;

  // =========================================================================
  // 7. VOICEOVER + FOLEY AUDIO & IN-BROWSER WAV + WEBM EXPORTERS
  // =========================================================================
  const voEl = document.getElementById('vo');
  const fAudio = document.getElementById('f-audio');
  let audioCtx = null;

  function triggerSynthCue(ac, dest, now, name) {
    const tone = (f0, f1, dur, type, vol, delay = 0) => {
      const s = now + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, s);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), s + dur);
      g.gain.setValueAtTime(vol, s);
      g.gain.exponentialRampToValueAtTime(0.001, s + dur);
      o.connect(g); g.connect(dest);
      o.start(s); o.stop(s + dur + 0.02);
    };
    switch (name) {
      case 'gold_stack':   tone(320, 640, 0.14, 'triangle', 0.10); break;
      case 'chip_ignite':  tone(440, 880, 0.24, 'sine', 0.10); break;
      case 'stage_split':  tone(140, 42, 0.32, 'triangle', 0.20); break;
      case 'whip_pan':     tone(260, 740, 0.24, 'sine', 0.08); break;
      case 'oven_drop':    tone(150, 45, 0.25, 'triangle', 0.18); break;
      case 'power_spike':  tone(220, 660, 0.28, 'sawtooth', 0.08); break;
      case 'stamp_impact': tone(160, 40, 0.28, 'triangle', 0.22); break;
      case 'cascade_ping': for (let i = 0; i < 3; i++) tone(740 + i * 160, 740 + i * 160, 0.12, 'sine', 0.07, i * 0.10); break;
      default:             tone(480, 860, 0.12, 'sine', 0.08);
    }
  }

  function playCueAudio(name) {
    if (!soundEnabled || CAPTURE_MODE) return;
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    triggerSynthCue(audioCtx, audioCtx.destination, audioCtx.currentTime, name);
  }

  async function exportMixedWav() {
    const sr = 24000;
    const totalFrames = Math.ceil(DUR * sr);
    const offline = new OfflineAudioContext(1, totalFrames, sr);
    try {
      const resp = await fetch(voEl.src);
      const arr = await resp.arrayBuffer();
      const voBuf = await offline.decodeAudioData(arr);
      const src = offline.createBufferSource();
      src.buffer = voBuf;
      src.connect(offline.destination);
      src.start(0);
    } catch (e) { console.warn('VO fetch skipped:', e); }
    if (soundEnabled) CUE_SHEET.forEach(c => triggerSynthCue(offline, offline.destination, c.t, c.name));
    const rendered = await offline.startRendering();
    const samples = rendered.getChannelData(0);
    const wavBuf = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(wavBuf);
    const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
    writeStr(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
    writeStr(8, 'WAVE'); writeStr(12, 'fmt '); view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, sr, true); view.setUint32(28, sr * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    writeStr(36, 'data'); view.setUint32(40, samples.length * 2, true);
    let offset = 44;
    for (let i = 0; i < samples.length; i++, offset += 2) {
      const s = clamp(samples[i], -1, 1);
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    const blob = new Blob([wavBuf], { type: 'audio/wav' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'act3_part2_mixed_audio.wav';
    a.click();
  }

  function exportCompositedWebM() {
    const comp = document.createElement('canvas');
    comp.width = 1920; comp.height = 1080;
    const cctx = comp.getContext('2d');
    const stream = comp.captureStream(30);
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const dest = audioCtx.createMediaStreamDestination();
    try {
      const voSrc = audioCtx.createMediaElementSource(voEl);
      voSrc.connect(dest); voSrc.connect(audioCtx.destination);
    } catch (_) {}
    dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));

    const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'act3_part2_jensen_elon.webm';
      a.click();
    };
    curT = 0; prevT = 0; playing = true; lastNow = performance.now();
    try { voEl.currentTime = 0; } catch (_) {}
    syncVoPlayback();
    rec.start();
    const copyTick = () => {
      cctx.drawImage(glCanvas, 0, 0);
      cctx.drawImage(canvas, 0, 0);
      if (playing && curT < DUR) requestAnimationFrame(copyTick);
      else if (rec.state === 'recording') rec.stop();
    };
    requestAnimationFrame(copyTick);
  }

  const hud = document.getElementById('hud');
  const scrubber = document.getElementById('scrubber');
  const tc = document.getElementById('tc');
  const bPlay = document.getElementById('b-play');
  const bRst = document.getElementById('b-rst');
  const bVo = document.getElementById('b-vo');
  const bLoad = document.getElementById('b-load');
  const bSfx = document.getElementById('b-sfx');
  const bCap = document.getElementById('b-cap');
  const bSheet = document.getElementById('b-sheet');
  const bExpWav = document.getElementById('b-exp-wav');
  const bExpVid = document.getElementById('b-exp-vid');
  const bHide = document.getElementById('b-hide');
  const bSpeed = document.getElementById('b-speed');
  const bFull = document.getElementById('b-full');

  let curT = parseFloat(params.get('t')) || 0;
  let prevT = curT;
  let playing = false;
  let lastNow = performance.now();
  let rate = 1;
  const RATES = [0.5, 1, 2];
  const SCENE_STARTS = [0.0, 3.46, 11.18, 19.18];

  if (CAPTURE_MODE) hud.classList.add('hidden');

  function syncVoPlayback() {
    if (!voEl) return;
    voEl.muted = !voEnabled;
    voEl.playbackRate = rate;
    if (playing && voEnabled && !CAPTURE_MODE && curT < (voEl.duration || WAV_DUR)) {
      if (Math.abs(voEl.currentTime - curT) > 0.22) {
        try { voEl.currentTime = curT; } catch (_) {}
      }
      if (voEl.paused) voEl.play().catch(() => {});
    } else if (!voEl.paused) {
      voEl.pause();
    }
  }

  function syncUI() {
    scrubber.value = curT.toFixed(2);
    tc.textContent = `${curT.toFixed(2).padStart(5, '0')} / ${DUR.toFixed(2)}s`;
    bPlay.textContent = playing ? 'Pause' : 'Play';
    bVo.textContent = `VO: ${voEnabled ? 'ON' : 'OFF'}`;
    bVo.classList.toggle('active', voEnabled);
    bSfx.textContent = `Foley: ${soundEnabled ? 'ON' : 'OFF'}`;
    bSfx.classList.toggle('active', soundEnabled);
    bCap.textContent = `Captions: ${showCaptions ? 'ON' : 'OFF'}`;
    bCap.classList.toggle('active', showCaptions);
    bSheet.textContent = `Sheet: ${showSheet ? 'ON' : 'OFF'}`;
    bSheet.classList.toggle('active', showSheet);
    bSpeed.textContent = `Speed: ${rate}x`;
  }

  function loop(now) {
    const dt = Math.min(0.1, (now - lastNow) / 1000) * rate;
    lastNow = now;
    if (playing) {
      prevT = curT;
      if (voEl && voEnabled && !voEl.paused && !isNaN(voEl.currentTime) && voEl.currentTime > 0 && voEl.currentTime < (voEl.duration || WAV_DUR)) {
        curT = Math.min(DUR, voEl.currentTime);
      } else {
        curT = Math.min(DUR, curT + dt);
      }
      if (curT >= DUR) { playing = false; syncVoPlayback(); }
      for (let i = 0; i < CUE_SHEET.length; i++) {
        const ct = CUE_SHEET[i].t;
        if ((prevT < ct && curT >= ct) || (prevT === 0 && curT > 0 && ct === 0)) {
          playCueAudio(CUE_SHEET[i].name);
        }
      }
      render(curT);
      syncUI();
    }
    requestAnimationFrame(loop);
  }

  function seekTo(t) {
    playing = false;
    curT = clamp(t, 0, DUR);
    prevT = curT;
    if (voEl) {
      voEl.pause();
      try { voEl.currentTime = Math.min(curT, voEl.duration || curT); } catch (_) {}
    }
    render(curT);
    syncUI();
  }

  bPlay.onclick = () => { if (curT >= DUR) { curT = 0; prevT = 0; } playing = !playing; lastNow = performance.now(); syncVoPlayback(); syncUI(); };
  bRst.onclick = () => { curT = 0; prevT = 0; playing = true; lastNow = performance.now(); if (voEl) { try { voEl.currentTime = 0; } catch (_) {} } syncVoPlayback(); render(curT); syncUI(); };
  bVo.onclick = () => { voEnabled = !voEnabled; syncVoPlayback(); syncUI(); };
  bLoad.onclick = () => fAudio.click();
  fAudio.onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (file && voEl) { voEl.src = URL.createObjectURL(file); voEnabled = true; syncVoPlayback(); syncUI(); }
  };
  bSfx.onclick = () => { soundEnabled = !soundEnabled; syncUI(); };
  bCap.onclick = () => { showCaptions = !showCaptions; render(curT); syncUI(); };
  bSheet.onclick = () => { showSheet = !showSheet; render(curT); syncUI(); };
  bExpWav.onclick = () => exportMixedWav();
  bExpVid.onclick = () => exportCompositedWebM();
  bHide.onclick = () => hud.classList.toggle('hidden');
  bSpeed.onclick = () => { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; syncVoPlayback(); syncUI(); };
  bFull.onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  };
  hud.addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') e.target.blur(); });
  scrubber.addEventListener('change', () => scrubber.blur());

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playing) { playing = false; syncVoPlayback(); syncUI(); }
  });

  let idleTimer = null;
  function wake() {
    hud.classList.remove('idle');
    document.body.style.cursor = '';
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (playing) { hud.classList.add('idle'); document.body.style.cursor = 'none'; }
    }, 2500);
  }
  if (!CAPTURE_MODE) { window.addEventListener('mousemove', wake); wake(); }
  scrubber.oninput = () => seekTo(parseFloat(scrubber.value));

  window.addEventListener('keydown', (e) => {
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'BUTTON' || ae.tagName === 'INPUT')) ae.blur();
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
    if (e.code === 'Space') { e.preventDefault(); bPlay.click(); }
    else if (e.key === 'r' || e.key === 'R') bRst.click();
    else if (e.key === 'v' || e.key === 'V') bVo.click();
    else if (e.key === 's' || e.key === 'S') bSfx.click();
    else if (e.key === 'c' || e.key === 'C') bCap.click();
    else if (e.key === 'm' || e.key === 'M') bSheet.click();
    else if (e.key === 'h' || e.key === 'H') bHide.click();
    else if (e.key === 'f' || e.key === 'F') bFull.click();
    else if (e.key >= '1' && e.key <= '4') seekTo(SCENE_STARTS[+e.key - 1]);
    else if (e.code === 'ArrowRight') seekTo(curT + 0.25);
    else if (e.code === 'ArrowLeft') seekTo(curT - 0.25);
  });

  Promise.all([document.fonts.ready].concat(SPR_LOAD)).then(() => {
    window.READY = true;
    render(curT);
    syncUI();
    if (!CAPTURE_MODE) requestAnimationFrame(loop);
  });
})();
</script>
</body>
