  // =========================================================================
  // 2. DETERMINISTIC HASH, EASING & EXACT SRT WORD KARAOKE CAPTIONS
  // =========================================================================
  function hash(seed) {
    let h = seed | 0;
    h = Math.imul(h ^ (h >>> 16), 0x85ebca6b);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const seg = (t, t0, t1) => clamp((t - t0) / Math.max(0.0001, t1 - t0), 0, 1);
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeBack = t => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  const easeBounce = t => {
    const n1 = 7.5625, d1 = 2.75;
    if (t < 1 / d1) return n1 * t * t;
    if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
    if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
    return n1 * (t -= 2.625 / d1) * t + 0.984375;
  };
  function env(t, start, end, enterDur = 0.25, exitDur = 0.25) {
    if (t < start || t > end) return 0;
    const eIn = enterDur > 0 ? easeOut(seg(t, start, start + enterDur)) : 1;
    const eOut = exitDur > 0 ? easeOut(1 - seg(t, end - exitDur, end)) : 1;
    return Math.min(eIn, eOut);
  }
  function hash2(x, y) {
    const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
    return n - Math.floor(n);
  }
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v) * 2 - 1;
  }

  const KEYCOL = {
    'best-case': PAL.amberHi, scenario: PAL.amberHi, spacex: PAL.cyanHi, tesla: PAL.coral,
    jensen: PAL.cyanHi, huang: PAL.cyanHi, terafab: PAL.amberHi, texas: PAL.amberHi,
    grimes: PAL.amberHi, county: PAL.amberHi, '22,000': PAL.cyanHi, acres: PAL.cyanHi,

    '$119': PAL.amberHi, billion: PAL.amberHi, court: PAL.coral, sealed: PAL.coral
  };
  const CAPS = SUBS.map((s, i) => {
    const words = s.text.split(' ');
    const tot = words.reduce((a, w) => a + w.length + 1, 0);
    let acc = 0;
    const ws = words.map(w => {
      const t0 = s.start + (s.end - s.start) * acc / tot;
      acc += w.length + 1;
      const t1 = s.start + (s.end - s.start) * acc / tot;
      return { w, t0, t1, col: KEYCOL[w.toLowerCase().replace(/[^a-z0-9$-]/g, '')] || null };
    });
    const next = SUBS[i + 1];
    const hold = !!next && next.start - s.end < 0.5;
    return { start: s.start, end: s.end, words: ws, hideAt: hold ? next.start : s.end + 0.16, fades: !hold };
  });


  // =========================================================================
  // 2B. TRUE 3D WORLD PERSPECTIVE CAMERA & 3D PROJECTED GEOMETRY ENGINE
  // =========================================================================
  const Cam3D = {
    pos: [0, 3.2, 12],
    look: [0, 1.8, 0],
    fov: 45,
    roll: 0,
    fwd: [0, 0, -1],
    right: [1, 0, 0],
    up: [0, 1, 0],
    set(p, l, fov = 45, roll = 0) {
      this.pos = p; this.look = l; this.fov = fov; this.roll = roll;
      let fx = l[0] - p[0], fy = l[1] - p[1], fz = l[2] - p[2];
      const fl = Math.hypot(fx, fy, fz) || 1;
      fx /= fl; fy /= fl; fz /= fl;
      this.fwd = [fx, fy, fz];
      const ux0 = Math.sin(roll), uy0 = Math.cos(roll), uz0 = 0;
      let rx = fy * uz0 - fz * uy0, ry = fz * ux0 - fx * uz0, rz = fx * uy0 - fy * ux0;
      const rl = Math.hypot(rx, ry, rz) || 1;
      rx /= rl; ry /= rl; rz /= rl;
      this.right = [rx, ry, rz];
      this.up = [ry * fz - rz * fy, rz * fx - rx * fz, rx * fy - ry * fx];
    },
    project(wx, wy, wz) {
      const dx = wx - this.pos[0], dy = wy - this.pos[1], dz = wz - this.pos[2];
      const cx = dx * this.right[0] + dy * this.right[1] + dz * this.right[2];
      const cy = dx * this.up[0]    + dy * this.up[1]    + dz * this.up[2];
      const cz = dx * this.fwd[0]   + dy * this.fwd[1]   + dz * this.fwd[2];
      if (cz <= 0.25) return null;
      const f = 540 / Math.tan((this.fov * Math.PI) / 360);
      return { x: 960 + (cx / cz) * f, y: 540 - (cy / cz) * f, z: cz, f };
    }
  };

  function draw3DFloorGrid(day, t) {
    ctx.save();
    const hY = clamp(540 + Cam3D.fwd[1] * 520, 260, 740);
    const sky = ctx.createLinearGradient(0, 0, 0, hY);
    if (day > 0.5) { sky.addColorStop(0, '#0C1C26'); sky.addColorStop(1, '#1A3545'); }
    else { sky.addColorStop(0, '#060D12'); sky.addColorStop(1, '#10212B'); }
    ctx.fillStyle = sky; ctx.fillRect(0, 0, 1920, hY);

    const flr = ctx.createLinearGradient(0, hY, 0, 1080);
    flr.addColorStop(0, '#132630'); flr.addColorStop(1, '#081116');
    ctx.fillStyle = flr; ctx.fillRect(0, hY, 1920, 1080 - hY);

    ctx.strokeStyle = 'rgba(100, 210, 199, 0.16)'; ctx.lineWidth = 1.5;
    for (let gx = -36; gx <= 36; gx += 4) {
      const p0 = Cam3D.project(gx, 0, 14), p1 = Cam3D.project(gx, 0, -64);
      if (p0 && p1) { ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke(); }
    }
    for (let gz = 12; gz >= -64; gz -= 4) {
      const p0 = Cam3D.project(-36, 0, gz), p1 = Cam3D.project(36, 0, gz);
      if (p0 && p1) { ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke(); }
    }
    ctx.restore();
  }

  function draw3DBox(wx, wy, wz, w, h, d, topCol, leftCol, rightCol, lineCol = '#0B161C', lw = 2) {
    const hw = w / 2, hh = h / 2, hd = d / 2;
    const pts = [
      [-hw, -hh, -hd], [hw, -hh, -hd], [hw, hh, -hd], [-hw, hh, -hd],
      [-hw, -hh,  hd], [hw, -hh,  hd], [hw, hh,  hd], [-hw, hh,  hd]
    ].map(([lx, ly, lz]) => Cam3D.project(wx + lx, wy + ly, wz + lz));
    if (pts.some(p => !p)) return;
    const drawFace = (idxs, col) => {
      ctx.fillStyle = col; ctx.strokeStyle = lineCol; ctx.lineWidth = lw; ctx.lineJoin = 'round';
      ctx.beginPath();
      pts.forEach((p, k) => { if (k === 0) ctx.moveTo(pts[idxs[0]].x, pts[idxs[0]].y); });
      ctx.moveTo(pts[idxs[0]].x, pts[idxs[0]].y);
      for (let i = 1; i < idxs.length; i++) ctx.lineTo(pts[idxs[i]].x, pts[idxs[i]].y);
      ctx.closePath(); ctx.fill(); if (lw > 0) ctx.stroke();

    drawFace([0, 1, 5, 4], leftCol);
    drawFace([1, 2, 6, 5], rightCol);

  // =========================================================================
  // 3. CANVAS & BOILED-INK + DISTINCT CHARACTER CAST ENGINE
  //    - host: Red-beanie stickman
  //    - jensen: Swept silver/grey hair, glasses, dark collared leather jacket

  // =========================================================================
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let curTime = 0;

  const grain = document.createElement('canvas');
  grain.width = 256; grain.height = 256;
  const gctx = grain.getContext('2d');
  const gimg = gctx.createImageData(256, 256);

  const grainPat = ctx.createPattern(grain, 'repeat');

  function toScreen(pt) {
    const m = ctx.getTransform();
    return [m.a * pt[0] + m.c * pt[1] + m.e, m.b * pt[0] + m.d * pt[1] + m.f];
  }
  function boilPts(pts, boilAmt, closed) {
    if (boilAmt <= 0 || pts.length < 2) return pts;
    const boilFrame = Math.floor(curTime * 12) % 3;
    const out = [], total = closed ? pts.length : pts.length - 1;
    for (let i = 0; i < total; i++) {
      const p0 = pts[i], p1 = pts[(i + 1) % pts.length];
      const dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.hypot(dx, dy);
      const steps = Math.max(1, Math.floor(len / 9));
      const nx = len > 0.001 ? -dy / len : 0, ny = len > 0.001 ? dx / len : 0;
      for (let s = 0; s < steps; s++) {
        const u = s / steps, x = p0[0] + dx * u, y = p0[1] + dy * u;
        const n = vnoise(x * 0.035 + boilFrame * 17.3, y * 0.035 + boilFrame * 9.1);
        out.push([x + nx * n * boilAmt * 2.0, y + ny * n * boilAmt * 2.0]);
      }
    }
    if (!closed) out.push(pts[pts.length - 1]);
    return out;
  }
  function toonPoly(localPts, { fill = null, line = PAL.ink, lw = 4.5, boil = 0.55, closed = true } = {}) {

    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.beginPath();
    ctx.moveTo(bPts[0][0], bPts[0][1]);
    for (let i = 1; i < bPts.length; i++) ctx.lineTo(bPts[i][0], bPts[i][1]);
    if (closed) ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (line && lw > 0) {
      ctx.strokeStyle = line; ctx.lineWidth = lw;
      ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
    }
    ctx.restore();
  }
  function circlePts(cx, cy, rx, ry, segs = 24) {
    const pts = [];
    for (let i = 0; i < segs; i++) {
      const a = (i / segs) * TAU;
      pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);

    return pts;
  }
  const rectPts = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];

  const CHAR_STYLE = {
    host:     { jacket: '#1F2C36', collar: '#EFECE4', pants: '#121B22', skin: '#F5CFB4', hair: 'beanie', hairCol: '#C8463C', glasses: false },
    jensen:   { jacket: '#14191F', collar: '#2C3742', pants: '#0F1419', skin: '#F5CFB4', hair: 'jensen', hairCol: '#DCE2E8', glasses: true },
    elon:     { jacket: '#18222B', collar: '#EFECE4', pants: '#10171E', skin: '#F2CCB0', hair: 'elon',   hairCol: '#38302A', glasses: false },
    engineer: { jacket: '#E8EEF2', collar: '#389E94', pants: '#DCE4EA', skin: '#C78E67', hair: 'helmet', hairCol: '#E2B857', glasses: true },
    lawyer:   { jacket: '#1A2633', collar: '#FAF8F4', pants: '#121B24', skin: '#E6B793', hair: 'short',  hairCol: '#3A3A3A', tie: '#C8463C' }
  };

  function drawCharacter(x, y, scale, opts = {}) {
    const st = CHAR_STYLE[opts.role || 'host'] || CHAR_STYLE.host;
    const {
      facing = 1, browTension = 0, armAngleL = 0.25, armAngleR = -0.25, bodyLean = 0,
      t = 0, walk = 0, walkAmt = 0, talk = 0, propR = null, alpha = 1, phase = 0
    } = opts;
    const D = 66, headR = 0.48 * D, torsoH = 1.38 * D, legH = 1.38 * D;
    const line = PAL.ink;
    const blink = ((t * 0.27 + phase) % 1) > 0.96 ? 1 : 0;

    ctx.save();
    if (alpha < 1) ctx.globalAlpha *= alpha;
    ctx.translate(x, y);
    ctx.scale(scale * facing, scale);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.beginPath(); ctx.ellipse(0, 4, 0.72 * D, 0.14 * D, 0, 0, TAU); ctx.fill();
    ctx.translate(0, -Math.abs(Math.sin(walk)) * 0.05 * D * walkAmt);

    const hipY = -legH;
    const sw = Math.sin(walk) * 0.52 * walkAmt;
    const leg = (cx, ang) => {
      ctx.save();
      ctx.translate(cx * D, hipY);
      ctx.rotate(ang);
      toonPoly([[-0.10 * D, 0], [0.10 * D, 0], [0.08 * D, legH - 0.12 * D], [-0.08 * D, legH - 0.12 * D]], { fill: st.pants, line, lw: 4.5 });
      toonPoly([[-0.14 * D, legH - 0.12 * D], [0.34 * D, legH - 0.12 * D], [0.38 * D, legH], [-0.14 * D, legH]], { fill: '#0A1014', line, lw: 4 });
      ctx.restore();
    };
    leg(-0.17, sw); leg(0.17, -sw);

    ctx.save();
    ctx.translate(0, hipY);
    ctx.rotate(bodyLean + Math.sin(t * 1.4 + phase * 5) * 0.012);
    const shoulderY = -torsoH;
    toonPoly([[-0.52 * D, shoulderY], [0.52 * D, shoulderY], [0.48 * D, 0], [-0.48 * D, 0]], { fill: st.jacket, line, lw: 5 });
    toonPoly([[-0.22 * D, shoulderY], [-0.12 * D, shoulderY + 0.20 * D], [0, shoulderY + 0.12 * D], [0.12 * D, shoulderY + 0.20 * D], [0.22 * D, shoulderY]], { fill: st.collar, line, lw: 3.5 });
    if (st.tie) {
      toonPoly([[0, shoulderY + 0.14 * D], [0.07 * D, shoulderY + 0.35 * D], [0, shoulderY + 0.85 * D], [-0.07 * D, shoulderY + 0.35 * D]], { fill: st.tie, line, lw: 2.5 });
    }

    const arm = (sx, ang, prop) => {
      ctx.save();
      ctx.translate(sx, shoulderY + 0.15 * D);
      ctx.rotate(ang);
      toonPoly([[-0.10 * D, 0], [0.10 * D, 0], [0.08 * D, 1.12 * D], [-0.08 * D, 1.12 * D]], { fill: st.jacket, line, lw: 4 });
      toonPoly(circlePts(0, 1.18 * D, 0.11 * D, 0.11 * D, 14), { fill: st.skin, line, lw: 3.5 });
      if (prop === 'brief') {
        toonPoly(rectPts(-0.22 * D, 1.05 * D, 0.44 * D, 0.52 * D), { fill: '#FAF8F4', line, lw: 3 });
        toonPoly(rectPts(-0.14 * D, 1.16 * D, 0.28 * D, 0.10 * D), { fill: '#C8463C', line: null, lw: 0 });
      } else if (prop === 'tablet') {
        toonPoly(rectPts(-0.20 * D, 1.00 * D, 0.40 * D, 0.30 * D), { fill: '#152630', line: '#389E94', lw: 3 });
      }
      ctx.restore();
    };
    arm(-0.48 * D, armAngleL, null);
    arm( 0.48 * D, armAngleR, propR);

    const headCY = shoulderY - headR * 0.92;
    toonPoly(circlePts(0, headCY, headR, headR, 28), { fill: st.skin, line, lw: 5 });

    const eyeY = headCY - 0.08 * D;
    const eyeH = Math.max(0.02 * D, 0.13 * D * (1 - blink));
    toonPoly(circlePts(-0.14 * D, eyeY, 0.055 * D, eyeH * 0.5, 12), { fill: PAL.ink, lw: 0, boil: 0.2 });
    toonPoly(circlePts( 0.20 * D, eyeY, 0.055 * D, eyeH * 0.5, 12), { fill: PAL.ink, lw: 0, boil: 0.2 });

    const browY = eyeY - 0.13 * D, bTilt = browTension * 0.06 * D;
    toonPoly([[-0.24 * D, browY - bTilt], [-0.03 * D, browY + bTilt]], { line, lw: 4, closed: false });
    toonPoly([[ 0.10 * D, browY + bTilt], [ 0.31 * D, browY - bTilt]], { line, lw: 4, closed: false });

    const mouthY = headCY + 0.18 * D;
    if (talk > 0) {
      const open = 0.02 + 0.10 * Math.abs(Math.sin(Math.floor(t * 12) * 2.3 + phase * 9)) * talk;
      toonPoly(circlePts(0.04 * D, mouthY, 0.09 * D, open * D, 12), { fill: '#6B1F1A', line, lw: 3, boil: 0.3 });
    } else {
      toonPoly([[-0.10 * D, mouthY], [0.18 * D, mouthY]], { line, lw: 3.5, closed: false });
    }

    if (st.glasses) {
      toonPoly(rectPts(-0.32 * D, eyeY - 0.11 * D, 0.28 * D, 0.22 * D), { fill: 'rgba(255,255,255,0.20)', line: '#2E3A44', lw: 3.2, boil: 0.25 });
      toonPoly(rectPts( 0.06 * D, eyeY - 0.11 * D, 0.28 * D, 0.22 * D), { fill: 'rgba(255,255,255,0.20)', line: '#2E3A44', lw: 3.2, boil: 0.25 });
      toonPoly([[-0.04 * D, eyeY - 0.02 * D], [0.06 * D, eyeY - 0.02 * D]], { line: '#2E3A44', lw: 3.2, closed: false });
    }

    if (st.hair === 'beanie') {
      // Iconic Red Beanie of the host stickman
      toonPoly([[-0.50 * D, headCY - 0.12 * D], [-0.46 * D, headCY - 0.56 * D], [0, headCY - 0.72 * D], [0.46 * D, headCY - 0.56 * D], [0.50 * D, headCY - 0.12 * D]], { fill: '#C8463C', line, lw: 4.5 });
      toonPoly(rectPts(-0.52 * D, headCY - 0.22 * D, 1.04 * D, 0.15 * D), { fill: '#A83229', line, lw: 4 });
      toonPoly(circlePts(0, headCY - 0.78 * D, 0.13 * D, 0.13 * D, 12), { fill: '#E2B857', line, lw: 3.5 });
    } else if (st.hair === 'jensen') {
      toonPoly([[-0.48 * D, headCY - 0.06 * D], [-0.46 * D, headCY - 0.42 * D], [-0.10 * D, headCY - 0.56 * D], [0.34 * D, headCY - 0.50 * D], [0.48 * D, headCY - 0.22 * D], [0.22 * D, headCY - 0.30 * D], [-0.22 * D, headCY - 0.26 * D]], { fill: st.hairCol, line, lw: 4.5 });
    } else if (st.hair === 'elon') {
      toonPoly([[-0.48 * D, headCY - 0.04 * D], [-0.44 * D, headCY - 0.44 * D], [0.05 * D, headCY - 0.58 * D], [0.46 * D, headCY - 0.40 * D], [0.48 * D, headCY - 0.06 * D], [0.26 * D, headCY - 0.30 * D], [-0.26 * D, headCY - 0.28 * D]], { fill: st.hairCol, line, lw: 4.5 });
    } else if (st.hair === 'helmet') {
      toonPoly([[-0.54 * D, headCY - 0.10 * D], [-0.48 * D, headCY - 0.54 * D], [0, headCY - 0.68 * D], [0.48 * D, headCY - 0.54 * D], [0.54 * D, headCY - 0.10 * D]], { fill: st.hairCol, line, lw: 4.5 });
      toonPoly(rectPts(-0.56 * D, headCY - 0.16 * D, 1.12 * D, 0.10 * D), { fill: '#C98E24', line, lw: 3.5 });
    } else {
      toonPoly([[-0.48 * D, headCY - 0.02 * D], [-0.46 * D, headCY - 0.40 * D], [0, headCY - 0.54 * D], [0.46 * D, headCY - 0.40 * D], [0.48 * D, headCY - 0.02 * D]], { fill: st.hairCol, line, lw: 4.5 });
    }
    ctx.restore();
    ctx.restore();
  }

  function hitFx(cx, cy, t, hitT, { color = PAL.amberHi, r = 180, rays = 14, dur = 0.55 } = {}) {
    const u = (t - hitT) / dur;
    if (u < 0 || u > 1) return;
    const e = easeOut(u);
    ctx.save();
    ctx.translate(cx, cy);
    if (u < 0.22) {
      ctx.globalAlpha = 0.55 * (1 - u / 0.22);
      ctx.fillStyle = PAL.white;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1 - u;
    ctx.strokeStyle = color; ctx.lineCap = 'round'; ctx.lineWidth = 10 * (1 - u) + 2;
    ctx.beginPath(); ctx.arc(0, 0, r * e, 0, TAU); ctx.stroke();
    ctx.lineWidth = 4.5;
    const seed = Math.floor(hitT * 100);
    for (let i = 0; i < rays; i++) {
      const a = (i / rays) * TAU + (hash2(seed + i, 3) - 0.5) * 0.35;
      const r0 = r * 0.35 * e + 14, r1 = r0 + 14 + 52 * (1 - u) * (0.6 + hash2(seed + i, 50) * 0.8);
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.stroke();
    }
    ctx.restore();
  }

  function drawShotBanner(title, sub, alpha, accent = PAL.amberHi, t = 0, t0 = 0) {
    if (alpha <= 0.01) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = '900 30px system-ui, sans-serif';
    const w = Math.max(430, ctx.measureText(title).width + 58);
    ctx.fillStyle = 'rgba(11, 22, 28, 0.92)';
    ctx.fillRect(68, 42, w, 56);
    ctx.fillStyle = accent;
    ctx.fillRect(68, 42, 10, 56);
    ctx.fillStyle = PAL.ivory;
    ctx.textAlign = 'left';
    const n = clamp(Math.floor((t - t0) * 48), 0, title.length);
    ctx.fillText(title.slice(0, n), 94, 80);
    if (sub) {
      ctx.font = '700 17px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(11, 22, 28, 0.86)';
      ctx.fillRect(68, 102, ctx.measureText(sub).width + 20, 26);
      ctx.fillStyle = accent;
      ctx.fillText(sub, 78, 120);
    }
    ctx.restore();
  }

  // Helper to draw isometric 3D architectural buildings & wafer stacks cleanly
  function drawIsoBlock(cx, cy, w, d, h, topCol, leftCol, rightCol, strokeCol = '#0B161C', lw = 2.5) {
    const dx = w * 0.86, dy = w * 0.42;
    const ex = d * 0.86, ey = d * 0.42;
    const p0 = [cx, cy - h];
    const p1 = [cx + dx, cy + dy - h];
    const p2 = [cx + dx - ex, cy + dy + ey - h];
    const p3 = [cx - ex, cy + ey - h];
    const b1 = [p1[0], p1[1] + h];
    const b2 = [p2[0], p2[1] + h];
    const b3 = [p3[0], p3[1] + h];

    ctx.lineJoin = 'round';
    ctx.strokeStyle = strokeCol; ctx.lineWidth = lw;

    // Left face
    ctx.fillStyle = leftCol;
    ctx.beginPath(); ctx.moveTo(p3[0], p3[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(b2[0], b2[1]); ctx.lineTo(b3[0], b3[1]); ctx.closePath();
    ctx.fill(); if (lw > 0) ctx.stroke();

    // Right face
    ctx.fillStyle = rightCol;
    ctx.beginPath(); ctx.moveTo(p2[0], p2[1]); ctx.lineTo(p1[0], p1[1]); ctx.lineTo(b1[0], b1[1]); ctx.lineTo(b2[0], b2[1]); ctx.closePath();
    ctx.fill(); if (lw > 0) ctx.stroke();

    // Top face
    ctx.fillStyle = topCol;
    ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]); ctx.closePath();
    ctx.fill(); if (lw > 0) ctx.stroke();
  }

  // =========================================================================
  // 4. 20-SHOT STORYBOARD SCENE RENDERERS (10M-RETENTION CUT)
  // =========================================================================
  function renderShots(t) {

    // Drive 3D perspective camera across the 20 storyboard beats with exact SRT landing points
    if (t < 2.85) {
      Cam3D.set([0.4, 2.2, lerp(6.2, 4.4, seg(t, 0, 2.85))], [0.6, 1.3, 0], 42, 0);
    } else if (t < 6.47) {
      Cam3D.set([0, 2.4, lerp(3.4, 6.2, easeOut(seg(t, 3.60, 5.20)))], [0, 1.5, 0], 40, 0);
    } else if (t < 10.31) {
      Cam3D.set([0.5, 2.1, lerp(6.8, 4.8, seg(t, 6.47, 10.31))], [0.4, 1.7, 0], 39, 0);
    } else if (t < 15.65) {
      const zMap = lerp(11.5, 5.2, easeInOut(seg(t, 10.31, 15.65)));
      Cam3D.set([0, 5.6, zMap], [0, 0.2, 0], 44, 0);
    } else if (t < 18.23) {
      const pull = easeInOut(seg(t, 15.85, 17.85));
      Cam3D.set([-1.8, 2.6, lerp(6.2, 16.5, pull)], [1.5, 1.8, -6], 45, 0);
    } else if (t < 25.71) {
      const alt = lerp(11.0, 17.5, easeOut(seg(t, 21.63, 25.71)));
      Cam3D.set([0, alt, 12.0], [0, 0.0, -4], 45, 0);
    } else if (t < 31.41) {
      const diveZ = lerp(14.0, -4.5, easeInOut(seg(t, 25.71, 31.41)));
      Cam3D.set([0, 3.6, diveZ], [0, 1.8, -14], 44, 0);
    } else if (t < 44.35) {
      const panX = lerp(-2.2, 3.2, easeInOut(seg(t, 38.65, 42.41)));
      Cam3D.set([panX, 3.2, 7.5], [panX * 0.5, 1.6, -4], 42, 0);
    } else if (t < 55.25) {
      const orb = lerp(-0.45, 0.45, easeInOut(seg(t, 47.39, 51.29)));
      Cam3D.set([Math.sin(orb) * 9.5, 5.2, Math.cos(orb) * 9.5], [0, 1.2, 0], 43, 0);
    } else {
      Cam3D.set([0, 2.5, lerp(9.5, 5.2, seg(t, 55.25, 66.80))], [0, 1.6, 0], 41, 0);
    }
    draw3DFloorGrid(t < 55.25 ? 1 : 0, t);

    // -----------------------------------------------------------------------
    // SHOT 1 (00:00.00 - 00:02.85): Darkness -> Banker's Lamp -> TERRAFAB CONFIDENTIAL Folder -> Hologram Fab
    // -----------------------------------------------------------------------
    if (t < 2.85) {
      const push = lerp(1.0, 1.14, seg(t, 0, 2.85));
      const lampOn = easeOut(seg(t, 0.15, 0.55));
      const openU = easeOut(seg(t, 1.35, 2.15));

      ctx.save();
      ctx.translate(960, 540); ctx.scale(push, push); ctx.translate(-960, -540);
      ctx.fillStyle = '#05080B'; ctx.fillRect(0, 0, 1920, 1080);

      // Warm desk surface illuminated by single banker's lamp
      if (lampOn > 0.01) {
        const cone = ctx.createRadialGradient(960, 420, 30, 960, 560, 780);
        cone.addColorStop(0, `rgba(242, 196, 108, ${0.46 * lampOn})`);
        cone.addColorStop(0.55, `rgba(140, 96, 36, ${0.18 * lampOn})`);
        cone.addColorStop(1, 'rgba(5, 8, 11, 0)');
        ctx.fillStyle = cone; ctx.fillRect(0, 0, 1920, 1080);
      }

      // Banker's lamp on left of desk
      ctx.fillStyle = '#C98E24'; ctx.fillRect(510, 430, 18, 220);
      ctx.beginPath(); ctx.ellipse(519, 650, 58, 16, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = lampOn > 0.2 ? '#2B8A6E' : '#133A2E';
      ctx.beginPath(); ctx.roundRect(455, 385, 130, 54, 18); ctx.fill();
      ctx.strokeStyle = '#E2B857'; ctx.lineWidth = 3; ctx.stroke();

      // Red-beanie stickman sitting across desk flipping folder open
      drawCharacter(690, 740, 0.92, {
        role: 'host', facing: 1, t, talk: 0.7,
        armAngleR: lerp(-0.5, -1.65, openU), armAngleL: 0.25, browTension: -0.2
      });

      // Manila Folder stamped TERRAFAB — CONFIDENTIAL
      ctx.save();
      ctx.translate(1030, 620);
      ctx.fillStyle = '#C6A372'; ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.roundRect(-210, -40, 420, 190, 10); ctx.fill(); ctx.stroke();
      // Top flap flipping open
      ctx.save();
      ctx.translate(0, -40);
      ctx.scale(1, lerp(1, -0.35, openU));
      ctx.fillStyle = '#DFC092';
      ctx.beginPath(); ctx.roundRect(-210, 0, 420, 175, 10); ctx.fill(); ctx.stroke();
      ctx.restore();

      // Red CONFIDENTIAL stamp
      ctx.save();
      ctx.rotate(-0.08);
      ctx.strokeStyle = PAL.coral; ctx.lineWidth = 4;
      ctx.strokeRect(-165, 22, 330, 52);
      ctx.fillStyle = PAL.coral; ctx.font = '900 22px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('TERRAFAB — CONFIDENTIAL', 0, 55);
      ctx.restore();

      // Glowing 3D Hologram of Semiconductor Fab rising on "scenario" (1.45s)
      if (openU > 0.05) {
        ctx.save();
        ctx.globalAlpha = openU;
        const holoY = lerp(20, -145, openU);
        const beam = ctx.createLinearGradient(0, 10, 0, holoY - 90);
        beam.addColorStop(0, 'rgba(56, 158, 148, 0.45)');
        beam.addColorStop(1, 'rgba(100, 210, 199, 0.02)');
        ctx.fillStyle = beam;
        ctx.beginPath(); ctx.moveTo(-130, 10); ctx.lineTo(130, 10); ctx.lineTo(220, holoY - 80); ctx.lineTo(-220, holoY - 80); ctx.closePath(); ctx.fill();
        drawIsoBlock(0, holoY, 130, 95, 58 * openU, 'rgba(100,210,199,0.55)', 'rgba(56,158,148,0.45)', 'rgba(32,110,104,0.45)', '#8ED119', 2);
        drawIsoBlock(-55, holoY + 25, 65, 55, 42 * openU, 'rgba(226,184,87,0.55)', 'rgba(201,142,36,0.45)', 'rgba(150,100,20,0.45)', '#E2B857', 2);
        ctx.restore();
      }
      ctx.restore();
      ctx.restore();

      hitFx(1030, 520, t, 1.45, { color: PAL.cyanHi, r: 240, rays: 16 });
      drawShotBanner('BEST-CASE SCENARIO', 'CONFIDENTIAL DOSSIER UNSEALED', env(t, 0.25, 2.80, 0.2, 0.2), PAL.amberHi, t, 0.25);
      return;
    }

    // -----------------------------------------------------------------------
    // SHOT 2 (00:02.85 - 00:06.47): Smartphone on Nightstand -> 5:59 AM -> 6:00 AM -> SpaceX x Tesla Alert
    // -----------------------------------------------------------------------
    if (t < 6.47) {
      const buzz = t >= 3.60 && t < 4.10 ? Math.sin(t * 95) * 9 * (1 - seg(t, 3.60, 4.10)) : 0;
      const pull = lerp(1.36, 1.0, easeOut(seg(t, 3.60, 5.20)));
      const alertU = easeBack(seg(t, 3.65, 4.15));

      ctx.save();
      ctx.translate(960 + buzz, 540 + buzz * 0.4); ctx.scale(pull, pull); ctx.translate(-960, -540);
      ctx.fillStyle = '#091218'; ctx.fillRect(0, 0, 1920, 1080);
      // Nightstand wood grain top
      ctx.fillStyle = '#18242C'; ctx.fillRect(0, 680, 1920, 400);

      // Smartphone body
      ctx.fillStyle = '#1E2D38'; ctx.strokeStyle = '#4B6373'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.roundRect(710, 140, 500, 810, 48); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#0D1921';
      ctx.beginPath(); ctx.roundRect(732, 164, 456, 762, 36); ctx.fill();

      // Clock flip 5:59 AM -> 6:00 AM at 3.55s
      const isSix = t >= 3.55;
      ctx.fillStyle = PAL.ivory; ctx.font = '900 94px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(isSix ? '6:00' : '5:59', 960, 320);
      ctx.fillStyle = PAL.cyanHi; ctx.font = '700 24px system-ui, sans-serif';
      ctx.fillText('MORNING EDITION • BREAKING ALERT', 960, 365);

      // Expanding Breaking News Banner with SpaceX & Tesla logos side by side
      if (alertU > 0.02) {
        ctx.save();
        ctx.translate(960, 540); ctx.scale(alertU, alertU);
        ctx.fillStyle = '#152834'; ctx.strokeStyle = PAL.amberHi; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.roundRect(-210, -110, 420, 230, 20); ctx.fill(); ctx.stroke();
        ctx.fillStyle = PAL.coral;
        ctx.beginPath(); ctx.roundRect(-210, -110, 420, 46, [20, 20, 0, 0]); ctx.fill();
        ctx.fillStyle = PAL.white; ctx.font = '900 20px system-ui, sans-serif';
        ctx.fillText('BREAKING NEWS • JOINT RELEASE', 0, -80);

        // SpaceX & Tesla side-by-side badges
        ctx.fillStyle = '#0B161C'; ctx.fillRect(-185, -45, 165, 64);
        ctx.fillStyle = PAL.cyanHi; ctx.font = '900 24px system-ui, sans-serif'; ctx.fillText('SPACEX', -102, -6);

        ctx.fillStyle = PAL.amberHi; ctx.font = '900 26px system-ui, sans-serif'; ctx.fillText('×', 0, -6);

        ctx.fillStyle = '#0B161C'; ctx.fillRect(20, -45, 165, 64);
        ctx.fillStyle = PAL.coral; ctx.font = '900 24px system-ui, sans-serif'; ctx.fillText('TESLA', 102, -6);

        ctx.fillStyle = PAL.ivory; ctx.font = '700 20px system-ui, sans-serif';
        ctx.fillText('Major Executive Announcement', 0, 68);
        ctx.restore();
      }
      ctx.restore();

      hitFx(960, 500, t, 3.65, { color: PAL.amberHi, r: 260, rays: 14 });
      drawShotBanner('BREAKING NEWS', 'SPACEX × TESLA JOINT RELEASE', env(t, 3.65, 6.40, 0.2, 0.2), PAL.coral, t, 3.65);
      return;
    }

    // -----------------------------------------------------------------------
    // SHOT 3 (00:06.47 - 00:10.31): Press Release Unfolds -> Jensen Huang 2.5D Portrait -> NAMED CHIEF EXECUTIVE
    // -----------------------------------------------------------------------
    if (t < 10.31) {
      const push = lerp(1.0, 1.12, seg(t, 6.47, 10.31));
      const popU = easeBack(seg(t, 6.85, 7.45));

          cue.words.forEach(w => {
            const ww = ctx.measureText(w.w).width;
            if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; }
            lines[lines.length - 1].push({ ...w, ww });
            lw += ww + space;
          });
          const lineW = lines.map(l => l.reduce((a, w) => a + w.ww, 0) + space * (l.length - 1));

  const voEl = document.getElementById('vo');

  function triggerSynthCue(ac, dest, now, name) {
    const tone = (f0, f1, dur, type, vol, delay = 0) => {
      const s = now + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, s);
      o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), s + dur);
      g.gain.setValueAtTime(vol, s);
      g.gain.exponentialRampToValueAtTime(0.001, s + dur);
      o.connect(g); g.connect(dest);
      o.start(s); o.stop(s + dur + 0.02);
    };
    switch (name) {
      case 'lamp_click':    tone(920, 420, 0.08, 'square', 0.09); break;
      case 'folder_open':   tone(180, 520, 0.26, 'sine', 0.12); break;
      case 'phone_buzz':    tone(140, 145, 0.18, 'sawtooth', 0.08); tone(880, 1320, 0.16, 'sine', 0.08, 0.12); break;
      case 'stamp_impact':  tone(160, 40, 0.28, 'triangle', 0.22); break;
      case 'sub_drop':      tone(130, 34, 0.42, 'triangle', 0.25); break;
      case 'mega_boom':     tone(120, 30, 0.50, 'triangle', 0.28); break;
      default:              tone(360, 720, 0.16, 'sine', 0.09);
    }
  }

  function playCueAudio(name) {
    if (!soundEnabled || CAPTURE_MODE) return;
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    triggerSynthCue(audioCtx, audioCtx.destination, audioCtx.currentTime, name);
  }

  async function exportMixedWav() {
    const sr = 24000;
    const totalFrames = Math.ceil(DUR * sr);
    const offline = new OfflineAudioContext(1, totalFrames, sr);
    try {
      const resp = await fetch(voEl.src);
      const arr = await resp.arrayBuffer();
      const voBuf = await offline.decodeAudioData(arr);
      const src = offline.createBufferSource();
      src.buffer = voBuf;
      src.connect(offline.destination);
      src.start(0);
    } catch (e) { console.warn('VO fetch skipped:', e); }
    if (soundEnabled) CUE_SHEET.forEach(c => triggerSynthCue(offline, offline.destination, c.t, c.name));
    const rendered = await offline.startRendering();
    const samples = rendered.getChannelData(0);
    const wavBuf = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(wavBuf);
    const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
    writeStr(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
    writeStr(8, 'WAVE'); writeStr(12, 'fmt '); view.setUint32(16, 16, true);
    view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, sr, true); view.setUint32(28, sr * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    writeStr(36, 'data'); view.setUint32(40, samples.length * 2, true);
    let offset = 44;
    for (let i = 0; i < samples.length; i++, offset += 2) {
      const s = clamp(samples[i], -1, 1);
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    const blob = new Blob([wavBuf], { type: 'audio/wav' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'act3_part1_10m_mixed_audio.wav';
    a.click();
  }

  function exportCompositedWebM() {
    const stream = canvas.captureStream(30);
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const dest = audioCtx.createMediaStreamDestination();
    try {
      const voSrc = audioCtx.createMediaElementSource(voEl);
      voSrc.connect(dest); voSrc.connect(audioCtx.destination);
    } catch (_) {}
    dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));

    const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'act3_part1_10m_terrafab.webm';
      a.click();
    };
    curT = 0; prevT = 0; playing = true; lastNow = performance.now();
    try { voEl.currentTime = 0; } catch (_) {}
    syncVoPlayback();
    rec.start();
    const watch = () => {
      if (playing && curT < DUR) requestAnimationFrame(watch);
      else if (rec.state === 'recording') rec.stop();
    };
    requestAnimationFrame(watch);
  }

  const hud = document.getElementById('hud');
  const scrubber = document.getElementById('scrubber');
  const tc = document.getElementById('tc');
  const bPlay = document.getElementById('b-play');
  const bRst = document.getElementById('b-rst');
  const bVo = document.getElementById('b-vo');
  const bLoad = document.getElementById('b-load');
  const bSfx = document.getElementById('b-sfx');
  const bCap = document.getElementById('b-cap');
  const bSheet = document.getElementById('b-sheet');
  const bExpWav = document.getElementById('b-exp-wav');
  const bExpVid = document.getElementById('b-exp-vid');
  const bHide = document.getElementById('b-hide');
  const bSpeed = document.getElementById('b-speed');
  const bFull = document.getElementById('b-full');

  let curT = parseFloat(params.get('t')) || 0;
  let prevT = curT;
  let playing = false;
  let lastNow = performance.now();
  let rate = 1;
  const RATES = [0.5, 1, 2];
  const SCENE_STARTS = [0.00, 15.65, 31.41, 44.35, 58.85];

  if (CAPTURE_MODE) hud.classList.add('hidden');

  function syncVoPlayback() {
    if (!voEl) return;
    voEl.muted = !voEnabled;
    voEl.playbackRate = rate;
    if (playing && voEnabled && !CAPTURE_MODE && curT < (voEl.duration || WAV_DUR)) {
      if (Math.abs(voEl.currentTime - curT) > 0.22) {
        try { voEl.currentTime = curT; } catch (_) {}
      }
      if (voEl.paused) voEl.play().catch(() => {});
    } else if (!voEl.paused) {
      voEl.pause();
    }
  }

  function syncUI() {
    scrubber.value = curT.toFixed(2);
    tc.textContent = `${curT.toFixed(2).padStart(5, '0')} / ${DUR.toFixed(2)}s`;
    bPlay.textContent = playing ? 'Pause' : 'Play';
    bVo.textContent = `VO: ${voEnabled ? 'ON' : 'OFF'}`;
    bVo.classList.toggle('active', voEnabled);
    bSfx.textContent = `Foley: ${soundEnabled ? 'ON' : 'OFF'}`;
    bSfx.classList.toggle('active', soundEnabled);
    bCap.textContent = `Captions: ${showCaptions ? 'ON' : 'OFF'}`;
    bCap.classList.toggle('active', showCaptions);
    bSheet.textContent = `Sheet: ${showSheet ? 'ON' : 'OFF'}`;
    bSheet.classList.toggle('active', showSheet);
    bSpeed.textContent = `Speed: ${rate}x`;
  }

  function loop(now) {
    const dt = Math.min(0.1, (now - lastNow) / 1000) * rate;
    lastNow = now;
    if (playing) {
      prevT = curT;
      if (voEl && voEnabled && !voEl.paused && !isNaN(voEl.currentTime) && voEl.currentTime > 0 && voEl.currentTime < (voEl.duration || WAV_DUR)) {
        curT = Math.min(DUR, voEl.currentTime);
      } else {
        curT = Math.min(DUR, curT + dt);
      }
      if (curT >= DUR) { playing = false; syncVoPlayback(); }
      for (let i = 0; i < CUE_SHEET.length; i++) {
        const ct = CUE_SHEET[i].t;
        if ((prevT < ct && curT >= ct) || (prevT === 0 && curT > 0 && ct === 0)) {
          playCueAudio(CUE_SHEET[i].name);
        }
      }
      render(curT);
      syncUI();
    }
    requestAnimationFrame(loop);
  }

  function seekTo(t) {
    playing = false;
    curT = clamp(t, 0, DUR);
    prevT = curT;
    if (voEl) {
      voEl.pause();
      try { voEl.currentTime = Math.min(curT, voEl.duration || curT); } catch (_) {}
    }
    render(curT);
    syncUI();
  }

  bPlay.onclick = () => { if (curT >= DUR) { curT = 0; prevT = 0; } playing = !playing; lastNow = performance.now(); syncVoPlayback(); syncUI(); };
  bRst.onclick = () => { curT = 0; prevT = 0; playing = true; lastNow = performance.now(); if (voEl) { try { voEl.currentTime = 0; } catch (_) {} } syncVoPlayback(); render(curT); syncUI(); };
  bVo.onclick = () => { voEnabled = !voEnabled; syncVoPlayback(); syncUI(); };
  bLoad.onclick = () => fAudio.click();
  fAudio.onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (file && voEl) { voEl.src = URL.createObjectURL(file); voEnabled = true; syncVoPlayback(); syncUI(); }
  };
  bSfx.onclick = () => { soundEnabled = !soundEnabled; syncUI(); };
  bCap.onclick = () => { showCaptions = !showCaptions; render(curT); syncUI(); };
  bSheet.onclick = () => { showSheet = !showSheet; render(curT); syncUI(); };
  bExpWav.onclick = () => exportMixedWav();
  bExpVid.onclick = () => exportCompositedWebM();
  bHide.onclick = () => hud.classList.toggle('hidden');
  bSpeed.onclick = () => { rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length]; syncVoPlayback(); syncUI(); };
  bFull.onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  };
  hud.addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') e.target.blur(); });
  scrubber.addEventListener('change', () => scrubber.blur());

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && playing) { playing = false; syncVoPlayback(); syncUI(); }
  });

  let idleTimer = null;
  function wake() {
    hud.classList.remove('idle');
    document.body.style.cursor = '';
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (playing) { hud.classList.add('idle'); document.body.style.cursor = 'none'; }
    }, 2500);
  }
  if (!CAPTURE_MODE) { window.addEventListener('mousemove', wake); wake(); }
  scrubber.oninput = () => seekTo(parseFloat(scrubber.value));

  window.addEventListener('keydown', (e) => {
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'BUTTON' || ae.tagName === 'INPUT')) ae.blur();
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') e.preventDefault();
    if (e.code === 'Space') { e.preventDefault(); bPlay.click(); }
    else if (e.key === 'r' || e.key === 'R') bRst.click();
    else if (e.key === 'v' || e.key === 'V') bVo.click();
    else if (e.key === 's' || e.key === 'S') bSfx.click();
    else if (e.key === 'c' || e.key === 'C') bCap.click();
    else if (e.key === 'm' || e.key === 'M') bSheet.click();
    else if (e.key === 'h' || e.key === 'H') bHide.click();
    else if (e.key === 'f' || e.key === 'F') bFull.click();
    else if (e.key >= '1' && e.key <= '5') seekTo(SCENE_STARTS[+e.key - 1]);
    else if (e.code === 'ArrowRight') seekTo(curT + 0.25);
    else if (e.code === 'ArrowLeft') seekTo(curT - 0.25);
  });

  document.fonts.ready.then(() => {
    window.READY = true;
    render(curT);
    syncUI();
    if (!CAPTURE_MODE) requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
